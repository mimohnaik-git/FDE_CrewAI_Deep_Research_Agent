[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crewai-deep-research"
version = "0.2.0"
description = "Evidence-linked research with CrewAI Flow and explicit retrieval"
requires-python = ">=3.13,<3.14"
dependencies = [
  "crewai[anthropic,litellm]>=1.15.2,<1.16",
  "streamlit>=1.62,<1.63",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[project.scripts]
research-evaluate = "research.evaluation:main"
research-offline = "research.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
